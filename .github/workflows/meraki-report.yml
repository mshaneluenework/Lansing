# ============================================================================
# Meraki Health Report - GitHub Actions Workflow Template
# ============================================================================
# HOW TO REUSE THIS FOR A DIFFERENT ORG:
#   You only ever need to edit ONE line in this file - marked "EDIT THIS LINE"
#   below. Nothing else in this file, and nothing in the .py script, needs
#   to change per org.
# ============================================================================

name: Meraki Health Report

on:
  schedule:
    - cron: "0 * * * *"   # runs every hour, on the hour. Change if you want a different frequency.
  workflow_dispatch: {}    # lets you also trigger it manually from the Actions tab

permissions:
  contents: write   # required so the workflow can commit the refreshed report back to the repo

jobs:
  generate-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install meraki

      - name: Generate report
        env:
          MERAKI_DASHBOARD_API_KEY: ${{ secrets.MERAKI_DASHBOARD_API_KEY }}
        run: python Meraki_7_Day_Newtork_Health_Report.py --org-id 361642   # <-- EDIT THIS LINE: put this repo's org ID here

      - name: Commit refreshed report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add meraki_health_report_latest.html latest.json
          git diff --quiet --cached || git commit -m "Auto-refresh network health report"
          git push
