name: Meraki Health Report

on:
  schedule:
    - cron: "0 * * * *"  # Runs every hour (adjust if needed)
  workflow_dispatch: {}     # Allows manual triggering from the Actions tab

permissions:
  contents: write           # Grants the bot permission to push updated reports back to the repo

jobs:
  generate-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install meraki

      - name: Generate report
        env:
          MERAKI_DASHBOARD_API_KEY: ${{ secrets.MERAKI_DASHBOARD_API_KEY }}
        run: python Meraki_7_Day_Network_Health_Report.py --org-id 361642

      - name: Commit refreshed report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add meraki_health_report_latest.html latest.json
          git diff --quiet --cached || git commit -m "Auto-refresh network health report"
          git push
